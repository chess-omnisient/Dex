<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Card (CC) Conversion Tracking Report</title>

<style>

:root, .viz-root {
  color-scheme: light;
  --page-bg:        #EAEAEC;
  --card-bg:        #FFFFFF;
  --card-radius:    16px;
  --text-primary:   #14141A;
  --text-secondary: #6B6F82;
  --text-muted:     #9497A6;
  --gridline:       #ECECEE;
  --baseline-axis:  #D6D7DC;
  --border:         rgba(16,1,97,0.08);
  --heading-navy:   #191C4A;
  --brand-teal-1:   #2E96BE;
  --brand-teal-2:   #3CA6CC;
  --series-internal: #100161;
  --series-external: #2F76B9;
  --series-accent:   #65B0FD;
  --pill-bg:         #B4E8F5;
  --pill-text:       #0B4A63;
  --status-good:     #22C55E;
  --status-critical: #E8491D;
  --shadow: 0 1px 2px rgba(16,1,97,0.05), 0 6px 18px rgba(16,1,97,0.07);
}
@media (prefers-color-scheme: dark) {
  :root, .viz-root {
    color-scheme: dark;
    --page-bg:        #131318;
    --card-bg:        #1D1D24;
    --text-primary:   #F2F2F5;
    --text-secondary: #B7B9C6;
    --text-muted:     #82869B;
    --gridline:       #2C2C35;
    --baseline-axis:  #3A3A44;
    --border:         rgba(255,255,255,0.10);
    --heading-navy:   #B9C2F2;
    --series-internal: #7B7CFF;
    --series-external: #5FA8E8;
    --series-accent:   #8FCBFF;
    --pill-bg:         #17414D;
    --pill-text:       #B4E8F5;
    --status-good:     #3ECF6B;
    --status-critical: #FF7161;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--page-bg); }
.viz-root {
  background: var(--page-bg);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 18px 44px; }

/* ---------- header ---------- */
.hero {
  background: linear-gradient(120deg, var(--brand-teal-1), var(--brand-teal-2));
  color: #fff;
  border-radius: var(--card-radius);
  padding: 16px 22px;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.hero h1 { margin: 0 0 3px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.hero p { margin: 0; color: rgba(255,255,255,0.85); font-size: 11px; }
.hero-logo { height: 22px; width: auto; display: block; flex-shrink: 0; filter: brightness(0) invert(1); opacity: 0.97; }

/* ---------- section shell ---------- */
.section { margin-bottom: 12px; }
.section-head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 2px; }
.section-title {
  font-size: 14.5px;
  font-weight: 750;
  color: var(--heading-navy);
  margin: 0 0 2px;
}
.section-sub { color: var(--text-secondary); font-size: 10.5px; margin: 0 0 10px; max-width: 760px; }
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 14px 16px;
}
.row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.row > .card { flex: 1 1 0; min-width: 200px; }
.grid { display: grid; gap: 14px; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 980px) { .grid-3 { grid-template-columns: 1fr; } .row { flex-direction: column; } }

.download-btn {
  background: var(--series-internal); color: #fff; border: none; border-radius: 7px;
  font: inherit; font-weight: 650; font-size: 10.5px; padding: 6px 12px; cursor: pointer;
  white-space: nowrap;
}
.download-btn:hover { opacity: 0.9; }

/* ---------- controls ---------- */
.controls-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-bottom: 10px; }
.control { display: flex; flex-direction: column; gap: 4px; }
.control label { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); font-weight: 650; }
.control select {
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  padding: 5px 8px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: var(--pill-bg);
  color: var(--pill-text);
  min-width: 130px;
}

/* ---------- Campaign Overview top row ---------- */
.row > .overview-main { flex: 1 1 480px; }
.row > .overview-badge { flex: 0 1 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.badge-circle {
  width: 30px; height: 30px; border-radius: 50%; background: var(--series-internal);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.badge-circle svg { width: 15px; height: 15px; }
.badge-value { font-size: 17px; font-weight: 750; color: var(--text-primary); }
.badge-label { font-size: 9.5px; color: var(--text-secondary); line-height: 1.3; }
.row > .filters-card { flex: 0 1 160px; display: flex; flex-direction: column; gap: 6px; }
.filters-card .control select { width: 100%; min-width: 0; }

.overview-grid2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; margin-top: 10px; }
@media (max-width: 900px) { .overview-grid2 { grid-template-columns: repeat(2, 1fr); } }
.overview-unified-grid { display: grid; grid-template-columns: 1.25fr 0.7fr 1.25fr; gap: 12px 16px; }
@media (max-width: 900px) { .overview-unified-grid { grid-template-columns: repeat(2, 1fr); } }
.overview-unified-grid .control { gap: 3px; }
.overview-unified-grid .control select { width: 100%; min-width: 0; }

.tile-label { font-size: 9.5px; color: var(--text-muted); margin-bottom: 2px; font-weight: 600; }
.tile-value { font-size: 12px; font-weight: 650; color: var(--text-primary); }

/* ---------- Conversion Summary ---------- */
.summary-grid { display: grid; grid-template-columns: 0.75fr 1.15fr 1.7fr; gap: 0; }
@media (max-width: 1080px) { .summary-grid { grid-template-columns: 1fr; } .summary-col { border-left: none !important; border-top: 1px solid var(--gridline); padding-top:18px; } }
.summary-col { padding: 0 14px; }
.summary-col:first-child { padding-left: 0; }
.summary-col:not(:first-child) { border-left: 1px solid var(--gridline); }
.summary-col-title { font-size: 12.5px; font-weight: 700; color: var(--text-primary); margin: 0 0 2px; }
.summary-col-caption { font-size: 10px; color: var(--text-muted); margin: 0 0 10px; }

.kpi-stack { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.kpi-block .kpi-number { font-size: 24px; font-weight: 800; color: var(--text-primary); line-height: 1.1; }
.kpi-block .kpi-name { font-size: 10.5px; color: var(--text-secondary); margin-top: 3px; font-weight: 600; }

/* ---------- ranked bar list ---------- */
.ranked-title { font-size: 13px; font-weight: 750; color: var(--brand-teal-1); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .03em; }
.ranked-title:first-child { margin-top: 0; }
.ranked-list { display: flex; flex-direction: column; gap: 7px; }
.ranked-row-label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 3px; }
.ranked-row-label .name { font-size: 10px; font-weight: 600; color: var(--text-secondary); }
.ranked-row-label .val { font-size: 11px; font-weight: 750; color: var(--text-primary); white-space: nowrap; }
.ranked-track { width: 100%; height: 8px; border-radius: 5px; background: var(--gridline); position: relative; overflow: hidden; }
.ranked-fill { height: 100%; border-radius: 5px; min-width: 4px; }

/* ---------- legend ---------- */
.legend { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 600; color: var(--text-secondary); }
.legend-dot { width: 16px; height: 8px; border-radius: 5px; display: inline-block; }

.chart-title { font-size: 12px; font-weight: 700; color: var(--text-primary); margin: 0 0 2px; }
.chart-caption { font-size: 11px; color: var(--text-muted); margin: 0 0 8px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.axis-label { fill: var(--text-muted); font-size: 9px; }
.gridline { stroke: var(--gridline); stroke-width: 1; }
.baseline { stroke: var(--baseline-axis); stroke-width: 1; }
.value-label { fill: var(--text-secondary); font-size: 9px; font-weight: 700; }

/* ---------- recap tables ---------- */
table.recap { border-collapse: collapse; width: 100%; font-size: 10px; margin-top: 8px; table-layout: fixed; }
table.recap th, table.recap td { padding: 5px 4px; text-align: right; font-variant-numeric: tabular-nums; width: 14%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.recap th:first-child, table.recap td:first-child { text-align: left; font-variant-numeric: normal; width: 16%; white-space: normal; }
table.recap thead th { color: var(--text-muted); font-weight: 650; font-size: 9.5px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--gridline); }
table.recap tbody th { color: var(--text-secondary); font-weight: 600; text-align: left; }
table.recap tbody tr + tr td, table.recap tbody tr + tr th { border-top: 1px dotted var(--gridline); }
table.recap td.current, table.recap th.current { background: var(--pill-bg); border-radius: 4px; color: var(--pill-text); }
table.recap .month-cell { cursor: pointer; }
table.recap .month-selected { background: var(--pill-bg); border-radius: 4px; color: var(--pill-text); }
table.recap .month-today { box-shadow: inset 0 0 0 2px var(--brand-teal-1); border-radius: 4px; }
table.recap .month-cell:hover:not(.month-selected) { background: var(--gridline); border-radius: 4px; }
.dot-internal, .dot-external { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.dot-internal { background: var(--series-internal); }
.dot-external { background: var(--series-external); }

/* ---------- comparison tool ---------- */
.compare-note { font-size: 11.5px; color: var(--text-secondary); margin-bottom: 14px; }
.compare-grid { display: grid; grid-template-columns: 1fr 1fr 0.8fr; gap: 22px; }
@media (max-width: 900px) { .compare-grid { grid-template-columns: 1fr; } }
.compare-col-title { font-size: 11.5px; font-weight: 700; color: var(--text-primary); margin: 0 0 10px; }
.outcome-list { display: flex; flex-direction: column; }
.outcome-row { display: flex; align-items: center; gap: 8px; height: 32px; border-bottom: 1px dotted var(--gridline); }
.outcome-row:first-child { padding-top: 0; }
.outcome-arrow { width: 0; height: 0; flex-shrink: 0; }
.outcome-arrow.up { border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid var(--status-good); }
.outcome-arrow.down { border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--status-critical); }
.outcome-arrow.flat { width: 10px; height: 2px; background: var(--text-muted); margin-top: 4px; }
.outcome-value { font-size: 12.5px; font-weight: 700; color: var(--text-primary); }

/* ---------- footer ---------- */
.footer { color: var(--text-muted); font-size: 11px; text-align: center; margin-top: 26px; line-height: 1.6; }

@media print {
  body { background: #fff; }
  .card { box-shadow: none; border: 1px solid #ddd; }
  .download-btn { display: none; }
}

</style>
<style>
.donut-wrap { position: relative; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; }
.donut-wrap svg { width: 100%; height: 100%; }
.donut-center { position: absolute; text-align: center; }
.donut-pct { font-size: 18px; font-weight: 800; color: var(--text-primary); line-height: 1; }
</style>
<style>
.product-chip {
  display: inline-block;
  background: #FFE066;
  color: #4A3B00;
  font-size: 11px;
  font-weight: 750;
  padding: 2px 9px;
  border-radius: 5px;
  margin: 2px 0 8px;
}
</style>

</head>
<body>
<div id="app" class="viz-root"></div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const MONTHS = [1,2,3,4,5,6];
const MONTH_LABELS = MONTHS.map(m => "M" + m);

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  return e;
}
function h(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v);
  }
  (children || []).forEach(c => { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}
function fmtInt(n) { return n == null ? "-" : Math.round(n).toLocaleString("en-US"); }
function fmtRand(n) {
  if (n == null) return "-";
  const m = n / 1e6;
  return "R" + m.toLocaleString("en-US", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + "M";
}
function fmtDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"});
}
function monthsBetween(startIso, endIso) {
  const s = new Date(startIso), e = new Date(endIso);
  return (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
}
function rowsFor(campaignId, section, product, group, month) {
  return DATA.rows.filter(r =>
    r.campaign === campaignId &&
    r.section === section &&
    r.product === product &&
    r.group === group &&
    (month == null || r.month === month)
  );
}
function sumField(rows, field) { return rows.reduce((a, r) => a + (r[field] || 0), 0); }
function monthValue(campaignId, section, product, group, month, field) {
  const rows = rowsFor(campaignId, section, product, group, month);
  if (!rows.length) return null;
  return sumField(rows, field);
}
function monthTerms(campaignId, section, product, group, month) {
  const rows = rowsFor(campaignId, section, product, group, month);
  const total = sumField(rows, "terms");
  if (!total) return "-";
  return Math.round(total).toString();
}
function monthSeries(campaignId, section, product, group, field) {
  return MONTHS.map(m => monthValue(campaignId, section, product, group, m, field));
}
function campaignById(id) { return DATA.campaigns.find(c => c.id === id); }
function niceMax(v) {
  if (v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  let step;
  if (norm <= 1) step = 1;
  else if (norm <= 2) step = 2;
  else if (norm <= 5) step = 5;
  else step = 10;
  return step * mag;
}
function barPath(x, yTop, yBase, w, r) {
  const rr = Math.max(0, Math.min(r, (yBase - yTop) / 2, w / 2));
  if (yBase - yTop < 1) return `M${x},${yBase} L${x+w},${yBase}`;
  return `M${x},${yBase} L${x},${yTop+rr} Q${x},${yTop} ${x+rr},${yTop} L${x+w-rr},${yTop} Q${x+w},${yTop} ${x+w},${yTop+rr} L${x+w},${yBase} Z`;
}
function renderGroupedBar(container, categories, series, opts) {
  opts = opts || {};
  const W = 480, H = opts.height || 220;
  const marginL = 34, marginR = 8, marginT = 10, marginB = 24;
  const plotW = W - marginL - marginR, plotH = H - marginT - marginB;
  const maxVal = niceMax(Math.max(1, ...series.flatMap(s => s.values)));
  const yFmt = opts.yFmt || fmtInt;
  const valFmt = opts.valFmt || fmtInt;

  const svg = svgEl("svg", {class: "chart", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "xMidYMid meet"});
  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const yv = maxVal * i / yTicks;
    const y = marginT + plotH - (plotH * i / yTicks);
    svg.appendChild(svgEl("line", {x1: marginL, x2: W - marginR, y1: y, y2: y, class: i === 0 ? "baseline" : "gridline"}));
    const t = svgEl("text", {x: marginL - 6, y: y + 3, class: "axis-label", "text-anchor": "end"});
    t.textContent = yFmt(yv);
    svg.appendChild(t);
  }

  const groupW = plotW / categories.length;
  const barGap = 2, seriesN = series.length;
  const clusterW = groupW * 0.62;
  const barW = Math.min(24, (clusterW - barGap * (seriesN - 1)) / seriesN);
  const clusterActualW = barW * seriesN + barGap * (seriesN - 1);

  categories.forEach((cat, ci) => {
    const groupCenter = marginL + groupW * (ci + 0.5);
    const clusterStart = groupCenter - clusterActualW / 2;
    series.forEach((s, si) => {
      const rawVal = s.values[ci];
      const val = rawVal || 0;
      const barH = (val / maxVal) * plotH;
      const x = clusterStart + si * (barW + barGap);
      const yTop = marginT + plotH - barH;
      const path = svgEl("path", {d: barPath(x, yTop, marginT + plotH, barW, 4), fill: s.color});
      const titleEl = svgEl("title", {});
      titleEl.textContent = `${s.name}, ${cat}: ${valFmt(rawVal)}`;
      path.appendChild(titleEl);
      svg.appendChild(path);
      if (opts.directLabel) {
        const lt = svgEl("text", {x: x + barW / 2, y: yTop - 4, class: "value-label", "text-anchor": "middle"});
        lt.textContent = valFmt(rawVal);
        svg.appendChild(lt);
      }
    });
    const xt = svgEl("text", {x: groupCenter, y: H - 6, class: "axis-label", "text-anchor": "middle"});
    xt.textContent = cat;
    svg.appendChild(xt);
  });

  container.innerHTML = "";
  container.appendChild(svg);
}
function renderLineChart(container, categories, series, opts) {
  opts = opts || {};
  const W = 480, H = opts.height || 160;
  const marginL = 34, marginR = 8, marginT = 12, marginB = 22;
  const plotW = W - marginL - marginR, plotH = H - marginT - marginB;
  const allVals = series.flatMap(s => s.values.filter(v => v != null));
  const maxVal = niceMax(Math.max(1, ...allVals, 0));
  const yFmt = opts.yFmt || ((v) => v.toFixed(0) + "%");

  const svg = svgEl("svg", {class: "chart", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "xMidYMid meet"});
  const yTicks = 3;
  for (let i = 0; i <= yTicks; i++) {
    const yv = maxVal * i / yTicks;
    const y = marginT + plotH - (plotH * i / yTicks);
    svg.appendChild(svgEl("line", {x1: marginL, x2: W - marginR, y1: y, y2: y, class: i === 0 ? "baseline" : "gridline"}));
    const t = svgEl("text", {x: marginL - 6, y: y + 3, class: "axis-label", "text-anchor": "end"});
    t.textContent = yFmt(yv);
    svg.appendChild(t);
  }
  const stepX = plotW / (categories.length - 1 || 1);
  categories.forEach((cat, ci) => {
    const xt = svgEl("text", {x: marginL + stepX * ci, y: H - 4, class: "axis-label", "text-anchor": "middle"});
    xt.textContent = cat;
    svg.appendChild(xt);
  });

  series.forEach(s => {
    const pts = s.values.map((v, i) => {
      const x = marginL + stepX * i;
      const y = v == null ? null : marginT + plotH - (v / maxVal) * plotH;
      return [x, y, v];
    });
    const validPts = pts.filter(p => p[1] != null);
    if (validPts.length) {
      const d = validPts.map((p, i) => (i === 0 ? "M" : "L") + p[0] + "," + p[1]).join(" ");
      svg.appendChild(svgEl("path", {d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}));
    }
    validPts.forEach(p => {
      const dot = svgEl("circle", {cx: p[0], cy: p[1], r: 4, fill: s.color, stroke: "var(--surface-1)", "stroke-width": 2});
      const titleEl = svgEl("title", {});
      titleEl.textContent = `${s.name}: ${yFmt(p[2])}`;
      dot.appendChild(titleEl);
      svg.appendChild(dot);
    });
  });

  container.innerHTML = "";
  container.appendChild(svg);
}
function legendRow(container, items) {
  const row = h("div", {class: "legend"});
  items.forEach(it => {
    row.appendChild(h("span", {class: "legend-item"}, [
      h("span", {class: "legend-dot", style: `background:${it.color}`}),
      it.name,
    ]));
  });
  container.appendChild(row);
}
function getVar(name) {

function metricValue(m, campaignId, month) {
  const product = m.productKind === "base" ? DATA.baseProduct : state.adjacentProduct;
  if (!product) return null;
  return monthValue(campaignId, m.section, product, m.group, month, m.field);
}

/* ---------- caption helper: array of {text, bold} -> DOM children ---------- */
function cap(parts) {
  return parts.map(p => p.bold ? h("b", {}, [p.text]) : p.text);
}

/* ---------- ranked horizontal bar list ---------- */
function renderRankedBars(container, items, opts) {
  opts = opts || {};
  const valFmt = opts.valFmt || fmtInt;
  const maxVal = Math.max(1, ...items.map(it => it.value || 0));
  const list = h("div", { class: "ranked-list" });
  items.forEach(it => {
    const val = it.value || 0;
    const pct = Math.max(1.5, Math.round((val / maxVal) * 100));
    list.appendChild(h("div", {}, [
      h("div", { class: "ranked-row-label" }, [
        h("span", { class: "name" }, [it.label]),
        h("span", { class: "val" }, [valFmt(it.value)]),
      ]),
      h("div", { class: "ranked-track" }, [
        h("div", { class: "ranked-fill", style: `width:${pct}%;background:${it.color}` }),
      ]),
    ]));
  });
  container.innerHTML = "";
  container.appendChild(list);
}

/* ---------- donut ring for Conversion Rate ---------- */
function renderDonut(container, pct) {
  const r = 40, cx = 46, cy = 46, circ = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, pct || 0));
  const dash = (clamped / 100) * circ;
  const svg = svgEl("svg", { viewBox: "0 0 92 92" });
  svg.appendChild(svgEl("circle", { cx, cy, r, fill: "none", stroke: "var(--gridline)", "stroke-width": 9 }));
  const arc = svgEl("circle", {
    cx, cy, r, fill: "none", stroke: "var(--series-internal)", "stroke-width": 9,
    "stroke-linecap": "round", "stroke-dasharray": `${dash} ${circ - dash}`,
    transform: `rotate(-90 ${cx} ${cy})`,
  });
  svg.appendChild(arc);
  const wrap = h("div", { class: "donut-wrap" }, [
    svg,
    h("div", { class: "donut-center" }, [h("div", { class: "donut-pct" }, [fmtPct1(pct)])]),
  ]);
  container.innerHTML = "";
  container.appendChild(wrap);
}

/* ---------- header ---------- */
function buildHeader() {
  return h("div", { class: "hero" }, [
    h("div", {}, [
      h("h1", {}, ["Consumer Insights: The Cross Industry Conversion Tracking Report"]),
      h("p", {}, [`${DATA.baseProductLabel} campaign performance, generated ${new Date(DATA.generatedAt).toLocaleString("en-GB")}`]),
    ]),
    h("img", { class: "hero-logo", src: TU_LOGO_SRC, alt: "TransUnion" }),
  ]);
}

/* ---------- Campaign Overview: 3 cards in a row ---------- */
function buildOverview() {
  const campaign = campaignById(state.campaignId);
  const wrap = h("div", { class: "section" });

  const mainCard = h("div", { class: "card overview-main" });
  mainCard.appendChild(h("div", { class: "section-title" }, ["Campaign Overview"]));

  const duration = campaign ? monthsBetween(campaign.start, campaign.end) : null;
  const grid = h("div", { class: "overview-unified-grid", style: "margin-top:10px" });

  const campaignSelect = h("select", { id: "campaign-select" });
  DATA.campaigns.filter(c => !c.isBaseline || DATA.campaigns.every(x => x.isBaseline)).forEach(c => {
    campaignSelect.appendChild(h("option", { value: c.id, selected: c.id === state.campaignId ? "selected" : null }, [c.name]));
  });
  grid.appendChild(h("div", { class: "control" }, [h("label", {}, ["Campaign"]), campaignSelect]));
  grid.appendChild(h("div", {}, [h("div", { class: "tile-label" }, ["Campaign duration"]), h("div", { class: "tile-value" }, [duration != null ? duration + " Months" : "-"])]));
  grid.appendChild(h("div", {}, [h("div", { class: "tile-label" }, ["Product advertised"]), h("div", { class: "tile-value" }, [DATA.baseProductLabel])]));

  grid.appendChild(h("div", {}, [h("div", { class: "tile-label" }, ["Campaign date"]), h("div", { class: "tile-value" }, [campaign ? `${fmtDate(campaign.start)} \u2013 ${fmtDate(campaign.end)}` : "-"])]));
  grid.appendChild(h("div", {}, [h("div", { class: "tile-label" }, ["Report duration"]), h("div", { class: "tile-value" }, [duration != null ? duration + " + 3 Months" : "-"])]));
  if (DATA.adjacentProducts.length) {
    const adjSelect = h("select", { id: "adjacent-select" });
    DATA.adjacentProducts.forEach(p => {
      adjSelect.appendChild(h("option", { value: p.code, selected: p.code === state.adjacentProduct ? "selected" : null }, [p.label]));
    });
    grid.appendChild(h("div", { class: "control" }, [h("label", {}, ["Adjacent product"]), adjSelect]));
  } else {
    grid.appendChild(h("div", {}));
  }
  mainCard.appendChild(grid);

  const personIcon = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8.5" r="3.2" fill="white"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  const badgeCard = h("div", { class: "card overview-badge" }, [
    h("div", { class: "badge-circle", html: personIcon }),
    h("div", { class: "badge-value" }, [campaign ? fmtInt(campaign.audience) : "-"]),
    h("div", { class: "badge-label" }, ["Total No. Consumers in Campaign"]),
  ]);

  const filtersCard = h("div", { class: "card filters-card" });
  filtersCard.appendChild(h("div", { class: "section-title" }, ["Additional Filters"]));
  const riskSelect = h("select", { id: "riskband-select" });
  RISK_BANDS.forEach(rb => riskSelect.appendChild(h("option", { value: rb, selected: rb === state.riskBand ? "selected" : null }, [rb])));
  filtersCard.appendChild(h("div", { class: "control" }, [h("label", {}, ["Risk Band"]), riskSelect]));
  const ageSelect = h("select", { id: "customerage-select" });
  AGE_BANDS.forEach(ab => ageSelect.appendChild(h("option", { value: ab, selected: ab === state.customerAge ? "selected" : null }, [ab])));
  filtersCard.appendChild(h("div", { class: "control" }, [h("label", {}, ["Customer Age"]), ageSelect]));

  wrap.appendChild(h("div", { class: "row" }, [mainCard, badgeCard, filtersCard]));
  return wrap;
}

/* ---------- Conversion Summary: one card, three columns ---------- */
function buildConversionSummary() {
  const wrap = h("div", { class: "section" });
  const card = h("div", { class: "card" });

  card.appendChild(h("div", { class: "section-head-row" }, [
    h("div", {}, [
      h("div", { class: "section-title", style: "margin-bottom:0" }, ["Conversion Summary"]),
      h("div", { class: "section-sub", style: "margin-bottom:0" }, [`As at ${new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" })}`]),
    ]),
    h("button", { class: "download-btn", id: "download-btn", type: "button" }, ["Click Here to Download Report"]),
  ]));

  const grid = h("div", { class: "summary-grid", style: "margin-top:12px" });

  // ---- column 1: KPI tiles (internal only), matches the 15 Jul 2026 workbook correction ----
  const campaign = campaignById(state.campaignId);
  const intVol = sumField(rowsFor(state.campaignId, "CREDIT_PRODUCT", DATA.baseProduct, "INTERNAL"), "volume");
  const conversionRate = campaign && campaign.audience ? (intVol / campaign.audience) * 100 : null;
  const intExposure = sumField(rowsFor(state.campaignId, "CREDIT_PRODUCT", DATA.baseProduct, "INTERNAL"), "exposure");

  const donutHost = h("div", {});
  const col1 = h("div", { class: "summary-col" }, [
    h("div", { class: "summary-col-title" }, [DATA.baseProductLabel]),
    h("div", { class: "summary-col-caption" }, cap([
      { text: "Summary of internal conversions for the " },
      { text: "advertised product", bold: true },
      { text: " to date" },
    ])),
    h("div", { class: "kpi-stack" }, [
      h("div", { class: "kpi-block" }, [h("div", { class: "kpi-number" }, [fmtInt(intVol)]), h("div", { class: "kpi-name" }, ["Conversions"])]),
      h("div", { class: "kpi-block" }, [donutHost, h("div", { class: "kpi-name" }, ["Conversion rate"])]),
      h("div", { class: "kpi-block" }, [h("div", { class: "kpi-number" }, [fmtRand(intExposure)]), h("div", { class: "kpi-name" }, ["Total credit exposure"])]),
    ]),
  ]);
  setTimeout(() => renderDonut(donutHost, conversionRate), 0);

  // ---- column 2: Total Conversion Activity (ranked bars) ----
  const extVol = sumField(rowsFor(state.campaignId, "CREDIT_PRODUCT", DATA.baseProduct, "EXTERNAL"), "volume");
  const adjIntVol = state.adjacentProduct ? sumField(rowsFor(state.campaignId, "ADJACENT_PRODUCT", state.adjacentProduct, "INTERNAL"), "volume") : 0;
  const adjExtVol = state.adjacentProduct ? sumField(rowsFor(state.campaignId, "ADJACENT_PRODUCT", state.adjacentProduct, "EXTERNAL"), "volume") : 0;
  const intRate = campaign && campaign.audience ? (intVol / campaign.audience) * 100 : null;
  const extRate = campaign && campaign.audience ? (extVol / campaign.audience) * 100 : null;
  const adjIntRate = state.adjacentProduct && campaign && campaign.audience ? (adjIntVol / campaign.audience) * 100 : null;
  const adjExtRate = state.adjacentProduct && campaign && campaign.audience ? (adjExtVol / campaign.audience) * 100 : null;

  const advLabel = DATA.baseProduct;
  const adjLabel = state.adjacentProduct || "Adjacent";
  const IC = getVar("--series-internal"), EC = getVar("--series-external");

  const col2 = h("div", { class: "summary-col" }, [
    h("div", { class: "summary-col-title" }, ["Total Conversion Activity"]),
    h("div", { class: "summary-col-caption" }, cap([
      { text: "Summary of conversions", bold: true },
      { text: " internally and across the wider credit market " },
      { text: "to date", bold: true },
    ])),
  ]);
  const volTitle = h("div", { class: "ranked-title" }, ["Conversion Volumes"]);
  const volHost = h("div", {});
  const rateTitle = h("div", { class: "ranked-title", style: "margin-top:26px" }, ["Conversion Rates"]);
  const rateHost = h("div", {});
  col2.appendChild(volTitle); col2.appendChild(volHost);
  col2.appendChild(rateTitle); col2.appendChild(rateHost);

  renderRankedBars(volHost, [
    { label: `Internal ${advLabel}`, value: intVol, color: IC },
    { label: `External ${advLabel}`, value: extVol, color: EC },
    { label: `Internal ${adjLabel}`, value: adjIntVol, color: IC },
    { label: `External ${adjLabel}`, value: adjExtVol, color: EC },
  ], { valFmt: fmtInt });
  renderRankedBars(rateHost, [
    { label: `Internal ${advLabel}`, value: intRate, color: IC },
    { label: `External ${advLabel}`, value: extRate, color: EC },
    { label: `Internal ${adjLabel}`, value: adjIntRate, color: IC },
    { label: `External ${adjLabel}`, value: adjExtRate, color: EC },
  ], { valFmt: fmtPct1 });

  // ---- column 3: Monthly Conversion Activity ----
  const col3 = h("div", { class: "summary-col" }, [
    h("div", { class: "summary-col-title" }, ["Monthly Conversion Activity"]),
    h("div", { class: "summary-col-caption" }, cap([
      { text: "Monthly Internal vs External conversion volumes and credit exposure of " },
      { text: "advertised product", bold: true },
      { text: ". This view will be updated monthly using bureau data." },
    ])),
  ]);
  col3.appendChild(h("div", { class: "product-chip" }, [DATA.baseProductLabel]));
  col3.appendChild(buildMonthlyBlock("CREDIT_PRODUCT", DATA.baseProduct, DATA.baseProductLabel));
  if (state.adjacentProduct) {
    const adjFull = DATA.adjacentProducts.find(p => p.code === state.adjacentProduct).label;
    col3.appendChild(h("div", { class: "chart-caption", style: "margin-top:14px;border-top:1px solid var(--gridline);padding-top:10px" },
      ["Monthly internal vs external conversion volumes and credit exposure of adjacent product"]));
    col3.appendChild(h("div", { class: "product-chip" }, [adjFull]));
    col3.appendChild(buildMonthlyBlock("ADJACENT_PRODUCT", state.adjacentProduct, adjFull));
  }

  grid.appendChild(col1); grid.appendChild(col2); grid.appendChild(col3);
  card.appendChild(grid);
  wrap.appendChild(card);
  return wrap;
}

/* ---------- Monthly Conversion Activity block (volume bar + rate line + tables) ---------- */
function buildMonthlyBlock(section, product, label) {
  const block = h("div", { style: "margin-top:6px" });
  const legendHost = h("div", {});
  legendRow(legendHost, [{ name: "Internal", color: getVar("--series-internal") }, { name: "External", color: getVar("--series-external") }]);
  block.appendChild(legendHost);

  const volHost = h("div", {});
  block.appendChild(volHost);
  const rateHost = h("div", { style: "margin-top:4px" });
  block.appendChild(rateHost);

  const intVolSeries = monthSeries(state.campaignId, section, product, "INTERNAL", "volume");
  const extVolSeries = monthSeries(state.campaignId, section, product, "EXTERNAL", "volume");
  const intRateSeries = monthSeries(state.campaignId, section, product, "INTERNAL", "rate");
  const extRateSeries = monthSeries(state.campaignId, section, product, "EXTERNAL", "rate");
  const intExpSeries = monthSeries(state.campaignId, section, product, "INTERNAL", "exposure");
  const extExpSeries = monthSeries(state.campaignId, section, product, "EXTERNAL", "exposure");

  setTimeout(() => {
    renderGroupedBar(volHost, MONTH_LABELS, [
      { name: "Internal", color: getVar("--series-internal"), values: intVolSeries },
      { name: "External", color: getVar("--series-external"), values: extVolSeries },
    ], { height: 120 });
    renderLineChart(rateHost, MONTH_LABELS, [
      { name: "Internal", color: getVar("--series-internal"), values: intRateSeries },
      { name: "External", color: getVar("--series-external"), values: extRateSeries },
    ], { height: 80 });
  }, 0);

  const curCampaign = campaignById(state.campaignId);
  const todayMonth = curCampaign ? Math.min(6, Math.max(1, monthsBetween(curCampaign.start, DATA.generatedAt))) : null; // 1-indexed
  const activeMonth = state.selectedMonth != null ? state.selectedMonth : todayMonth; // 1-indexed
  function monthCls(monthNum) {
    if (monthNum === activeMonth) return "month-cell month-selected";
    if (monthNum === todayMonth) return "month-cell month-today";
    return "month-cell";
  }
  const table = h("table", { class: "recap" });
  table.appendChild(h("thead", {}, [h("tr", {}, [h("th", {}, ["Credit exposure (R'M)"]), ...MONTH_LABELS.map((m, i) => h("th", { class: monthCls(i + 1), "data-month": i + 1 }, [m]))])]));
  table.appendChild(h("tbody", {}, [
    h("tr", {}, [h("th", {}, [h("span", { class: "dot-internal" }), "Internal"]), ...intExpSeries.map((v, i) => h("td", { class: monthCls(i + 1), "data-month": i + 1 }, [fmtRand(v)]))]),
    h("tr", {}, [h("th", {}, [h("span", { class: "dot-external" }), "External"]), ...extExpSeries.map((v, i) => h("td", { class: monthCls(i + 1), "data-month": i + 1 }, [fmtRand(v)]))]),
  ]));
  block.appendChild(table);

  return block;
}

/* ---------- Comparison Tool ---------- */
function outcomeList(metrics, rangeACampaign, rangeBCampaign) {
  const list = h("div", { class: "outcome-list" });
  metrics.forEach(m => {
    const a = metricValue(m, rangeACampaign, state.monthA);
    const b = metricValue(m, rangeBCampaign, state.monthB);
    const delta = (b == null ? 0 : b) - (a == null ? 0 : a);
    const dir = delta > 0 ? "up" : delta < 0 ? "down" : "flat";
    list.appendChild(h("div", { class: "outcome-row" }, [
      h("div", { class: "outcome-arrow " + dir }),
      h("div", { class: "outcome-value" }, [m.fmt(Math.abs(delta))]),
    ]));
  });
  return list;
}
function rankedFromMetrics(container, metrics, campaignId, month) {
  const IC = getVar("--series-internal"), EC = getVar("--series-external");
  const items = metrics.map(m => ({ label: m.label, value: metricValue(m, campaignId, month) || 0, color: m.group === "INTERNAL" ? IC : EC }));
  renderRankedBars(container, items, { valFmt: metrics[0] ? metrics[0].fmt : fmtInt });
}
function buildComparisonTool() {
  const wrap = h("div", { class: "section" });
  const card = h("div", { class: "card" });
  card.appendChild(h("div", { class: "section-title" }, ["Comparison Tool"]));
  card.appendChild(h("div", { class: "section-sub" }, ["Use this tool to compare campaign performance, either by month or against a baseline (if provided)"]));

  const controls = h("div", { class: "controls-row" });
  const modeSelect = h("select", { id: "mode-select" });
  ["Month", "Baseline"].forEach(v => modeSelect.appendChild(h("option", { value: v, selected: v === state.mode ? "selected" : null }, [v])));
  controls.appendChild(h("div", { class: "control" }, [h("label", {}, ["Comparison mode"]), modeSelect]));
  const monthASelect = h("select", { id: "montha-select" });
  MONTHS.forEach(m => monthASelect.appendChild(h("option", { value: m, selected: m === state.monthA ? "selected" : null }, ["Month " + m])));
  controls.appendChild(h("div", { class: "control" }, [h("label", {}, ["Range A month (campaign)"]), monthASelect]));
  const monthBSelect = h("select", { id: "monthb-select" });
  MONTHS.forEach(m => monthBSelect.appendChild(h("option", { value: m, selected: m === state.monthB ? "selected" : null }, ["Month " + m])));
  controls.appendChild(h("div", { class: "control" }, [h("label", {}, [state.mode === "Baseline" ? "Range B month (baseline)" : "Range B month (campaign)"]), monthBSelect]));
  card.appendChild(controls);

  const note = state.mode === "Baseline"
    ? `Comparing Month ${state.monthA} of the selected campaign against Month ${state.monthB} of the baseline campaign (${campaignById(DATA.baselineCampaignId) ? campaignById(DATA.baselineCampaignId).name : DATA.baselineCampaignId}).`
    : `Comparing Month ${state.monthA} against Month ${state.monthB} of the same campaign.`;
  card.appendChild(h("p", { class: "compare-note" }, [note]));

  const rangeACampaign = state.campaignId;
  const rangeBCampaign = state.mode === "Baseline" ? DATA.baselineCampaignId : state.campaignId;
  const rangeALabel = "Campaign M" + state.monthA;
  const rangeBLabel = (state.mode === "Baseline" ? "Baseline M" : "Campaign M") + state.monthB;

  function block(title, metrics) {
    const section = h("div", { style: "margin-bottom:16px" });
    section.appendChild(h("div", { class: "ranked-title", style: "margin-top:0" }, [title]));
    const grid = h("div", { class: "compare-grid" });
    const colA = h("div", {}, [h("div", { class: "compare-col-title" }, [rangeALabel])]);
    const hostA = h("div", {}); colA.appendChild(hostA);
    const colB = h("div", {}, [h("div", { class: "compare-col-title" }, [rangeBLabel])]);
    const hostB = h("div", {}); colB.appendChild(hostB);
    const colC = h("div", {}, [h("div", { class: "compare-col-title" }, ["Comparison Outcomes"])]);
    colC.appendChild(outcomeList(metrics, rangeACampaign, rangeBCampaign));
    rankedFromMetrics(hostA, metrics, rangeACampaign, state.monthA);
    rankedFromMetrics(hostB, metrics, rangeBCampaign, state.monthB);
    grid.appendChild(colA); grid.appendChild(colB); grid.appendChild(colC);
    section.appendChild(grid);
    return section;
  }

  card.appendChild(block("Conversion Volumes", COMPARE_METRICS));
  card.appendChild(block("Conversion Rates", COMPARE_RATE_METRICS));

  wrap.appendChild(card);
  return wrap;
}

/* ---------- Credit Terms Overview ---------- */
function hasAnyTerms() {
  return DATA.rows.some(r => r.campaign === state.campaignId && r.terms != null && r.terms !== 0 &&
    ((r.section === "CREDIT_PRODUCT" && r.product === DATA.baseProduct) ||
     (r.section === "ADJACENT_PRODUCT" && r.product === state.adjacentProduct)));
}
function buildCreditTerms() {
  if (!hasAnyTerms()) return null;
  const wrap = h("div", { class: "section" });
  const card = h("div", { class: "card" });
  card.appendChild(h("div", { class: "section-title" }, ["Credit Terms Overview (Where applicable)"]));
  card.appendChild(h("div", { class: "section-sub" }, ["Monthly internal vs external view of the terms granted for the advertised product and adjacent products taken up over the campaign period"]));

  const grid = h("div", { class: "grid grid-3", style: "grid-template-columns:1fr 1fr" });
  const baseTable = h("table", { class: "recap" });
  baseTable.appendChild(h("thead", {}, [h("tr", {}, [h("th", {}, [DATA.baseProduct]), ...MONTH_LABELS.map(m => h("th", {}, [m]))])]));
  baseTable.appendChild(h("tbody", {}, [
    h("tr", {}, [h("th", {}, [h("span", { class: "dot-internal" }), "Internal"]), ...MONTHS.map(m => h("td", {}, [monthTerms(state.campaignId, "CREDIT_PRODUCT", DATA.baseProduct, "INTERNAL", m)]))]),
    h("tr", {}, [h("th", {}, [h("span", { class: "dot-external" }), "External"]), ...MONTHS.map(m => h("td", {}, [monthTerms(state.campaignId, "CREDIT_PRODUCT", DATA.baseProduct, "EXTERNAL", m)]))]),
  ]));
  grid.appendChild(h("div", {}, [baseTable]));

  if (state.adjacentProduct) {
    const adjTable = h("table", { class: "recap" });
    adjTable.appendChild(h("thead", {}, [h("tr", {}, [h("th", {}, [state.adjacentProduct]), ...MONTH_LABELS.map(m => h("th", {}, [m]))])]));
    adjTable.appendChild(h("tbody", {}, [
      h("tr", {}, [h("th", {}, [h("span", { class: "dot-internal" }), "Internal"]), ...MONTHS.map(m => h("td", {}, [monthTerms(state.campaignId, "ADJACENT_PRODUCT", state.adjacentProduct, "INTERNAL", m)]))]),
      h("tr", {}, [h("th", {}, [h("span", { class: "dot-external" }), "External"]), ...MONTHS.map(m => h("td", {}, [monthTerms(state.campaignId, "ADJACENT_PRODUCT", state.adjacentProduct, "EXTERNAL", m)]))]),
    ]));
    grid.appendChild(h("div", {}, [adjTable]));
  }
  card.appendChild(grid);
  wrap.appendChild(card);
  return wrap;
}

/* ---------- render + wiring ---------- */
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const wrap = h("div", { class: "wrap" });
  wrap.appendChild(buildHeader());
  wrap.appendChild(buildOverview());
  wrap.appendChild(buildConversionSummary());
  wrap.appendChild(buildComparisonTool());
  const terms = buildCreditTerms();
  if (terms) wrap.appendChild(terms);
  app.appendChild(wrap);
  wireControls();
}

function wireControls() {
  const campaignSelect = document.getElementById("campaign-select");
  if (campaignSelect) campaignSelect.addEventListener("change", (e) => { state.campaignId = e.target.value; state.selectedMonth = null; render(); });
  const adjacentSelect = document.getElementById("adjacent-select");
  if (adjacentSelect) adjacentSelect.addEventListener("change", (e) => { state.adjacentProduct = e.target.value; render(); });
  const modeSelect = document.getElementById("mode-select");
  if (modeSelect) modeSelect.addEventListener("change", (e) => { state.mode = e.target.value; render(); });
  const monthA = document.getElementById("montha-select");
  if (monthA) monthA.addEventListener("change", (e) => { state.monthA = parseInt(e.target.value, 10); render(); });
  const monthB = document.getElementById("monthb-select");
  if (monthB) monthB.addEventListener("change", (e) => { state.monthB = parseInt(e.target.value, 10); render(); });
  const riskSelect = document.getElementById("riskband-select");
  if (riskSelect) riskSelect.addEventListener("change", (e) => { state.riskBand = e.target.value; render(); });
  const ageSelect = document.getElementById("customerage-select");
  if (ageSelect) ageSelect.addEventListener("change", (e) => { state.customerAge = e.target.value; render(); });
  const dlBtn = document.getElementById("download-btn");
  if (dlBtn) dlBtn.addEventListener("click", () => window.print());
  document.querySelectorAll(".month-cell").forEach(el => {
    el.addEventListener("click", () => { state.selectedMonth = parseInt(el.dataset.month, 10); render(); });
  });
}

const state = {
  campaignId: DATA.defaultCampaignId,
  adjacentProduct: DATA.defaultAdjacentProduct,
  mode: "Month",
  monthA: 3,
  monthB: 2,
  riskBand: "All Risk Bands",
  customerAge: "All Ages",
  selectedMonth: null,
};

render();

</script>
</body>
</html>
