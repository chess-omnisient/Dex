# Dex Productivity Integrations Config
# This tracked file is a clean-install template. /integrate-mcp populates each
# user's local integration state when they choose to connect a service.

# Last updated: (auto-populated when integrations change)
last_updated: null

# Enabled integrations
enabled:
  notion: false
  slack: false
  google: false
  teams: true

# Integration-specific settings are stored in separate files:
# - notion.yaml (Notion-specific config)
# - slack.yaml (Slack-specific config)
# - google.yaml (Google-specific config)

# Integration hooks - which Dex features use integrations
hooks:
  meeting_prep:
    use_notion: true      # Pull relevant Notion docs
    use_slack: true       # Pull recent Slack context with attendees
    use_teams: true       # Pull recent Teams context with attendees
    use_google: true      # Pull email threads with attendees
  
  person_pages:
    use_notion: true      # Link Notion pages
    use_slack: true       # Show Slack mentions
    use_teams: true       # Show Teams mentions
    use_google: true      # Show email history
  
  daily_plan:
    use_notion: false     # Not used by default
    use_slack: true       # Not used by default
    use_teams: true       # Surface unread Teams chats
    use_google: true      # Surface emails needing response

  commitment_detection:
    use_slack: true       # Detect promises in Slack
    use_teams: true       # Detect promises in Teams

# Detection cache (auto-populated by detect.py)
detected:
  notion: null
  slack: null
  teams: null
  google: null

# Task-sync credentials are raw only in the ignored vault-root .env file.
todoist:
  enabled: false
  api_key_env_var: TODOIST_API_KEY

trello:
  enabled: false
  api_key_env_var: TRELLO_API_KEY
  token_env_var: TRELLO_TOKEN

# Pipedrive CRM (run /pipedrive-setup to connect).
# The access token lives in the macOS Keychain (service dex-pipedrive) or the
# ignored vault-root .env file. Non-secret settings live in pipedrive.yaml
# (template: pipedrive.yaml.example).
pipedrive:
  enabled: false
  token_env_var: PIPEDRIVE_API_TOKEN
